<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>生年月日</title>
        <script src="main.js" defer></script>
    </head>
    <body>
        <h1>生年月日の入力</h1>

        <label for="month">月:</label>
        <input type="number" id="month" placeholder="月を入力してください" min="1" max="12">
        <label for="day">日:</label>
        <input type="number" id="day" placeholder="日を入力してください" min="1" max="31">
        <button onclick="errorInput()">入力</button>

        <div></div>

        <label for="month-select">月を選択</label>
        <select name="mm" id="month-select">
            <option value="">選択してください</option>
            <option value="m1">1</option>
            <option value="m2">2</option>
            <option value="m3">3</option>
            <option value="m4">4</option>
            <option value="m5">5</option>
            <option value="m6">6</option>
            <option value="m7">7</option>
            <option value="m8">8</option>
            <option value="m9">9</option>
            <option value="m10">10</option>
            <option value="m11">11</option>
            <option value="m12">12</option>
        </select>

        <label for="day-select">日を選択</label>
        <select name="dd" id="day-select">
            <option value="">選択してください</option>
            <option value="d1">1日</option>
    </body>
</html>

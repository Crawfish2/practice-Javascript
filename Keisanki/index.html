<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <title>web計算機</title>
        <script src="enzan.js" defer></script>
        <link rel="stylesheet" href="cookieStar.css">
    </head>

    <body>
        <form name="Keisanki">
            <div>
                <p id="kakubasyo"></p>
            </div>
            <div>
                <input type="button" class="suuzi" value="1" onclick="enzan()">
                <input type="button" class="suuzi" value="2" onclick="enzan()">
                <input type="button" class="suuzi" value="3" onclick="enzan()">
                <input type="button" class="enzansi" value="+" onclick="enzan()">
            </div>
            <div>
                <input type="button" class="suuzi" value="4" onclick="enzan()">
                <input type="button" class="suuzi" value="5" onclick="enzan()">
                <input type="button" class="suuzi" value="6" onclick="enzan()">
                <input type="button" class="enzansi" value="-" onclick="enzan()">
            </div>
            <div>
                <input type="button" class="suuzi" value="7" onclick="enzan()">
                <input type="button" class="suuzi" value="8" onclick="enzan()">
                <input type="button" class="suuzi" value="9" onclick="enzan()">
                <input type="button" class="enzansi" value="×" onclick="enzan()">
            </div>
            <div>
                <input type="button" class="enzansi" value="C" onclick="enzan()" id="reset">
                <input type="button" class="suuzi" value="0" onclick="enzan()">
                <input type="button" class="enzansi" value="=" onclick="enzan()" id="equal">
                <input type="button" class="enzansi" value="÷" onclick="enzan()">
            </div>
        </form>
    </body>
</html>

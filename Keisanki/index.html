<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>web計算機</title>
    <script src="enzan.js" defer></script>
    <link rel="stylesheet" href="cookieStar.css">
</head>

<body>
    <div>
        <p id="kakubasyo"></p>
    </div>
    <div>
        <button id="one" class="suuzi">1</button>
        <button id="two" class="suuzi">2</button>
        <button id="three" class="suuzi">3</button>
        <button id="plus" class="enzan">+</button>
        <br>
        <button id="four" class="suuzi">4</button>
        <button id="five" class="suuzi">5</button>
        <button id="six" class="suuzi">6</button>
        <button id="minus" class="enzan">-</button>
        <br>
        <button id="seven" class="suuzi">7</button>
        <button id="eite" class="suuzi">8</button>
        <button id="nine" class="suuzi">9</button>
        <button id="multi" class="enzan">×</button>
        <br>
        <button id="reset" class="enzan">C</button>
        <button id="zero" class="suuzi">0</button>
        <button id="epual" class="enzan">=</button>
        <button id="divison" class="enzan">÷</button>
    </div>
</body>


</html>

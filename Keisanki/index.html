<!DOCTYPE html>

    <link rel="stylesheet" href="cookieStar.css">
</head>

<body>

        <input type="text" id="kakubasyo">

    <div id="suuzi">

        <button id="three">3</button>

        <button id="four">4</button>
        <button id="five">5</button>

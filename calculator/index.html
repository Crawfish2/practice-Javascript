<!DOCTYPE html>
<html lang="ja">

    <head>
        <meta charset="UTF-8">
        <title>web計算機</title>
        <script src="enzan.js" defer></script>
        <link rel="stylesheet" href="cookieStar.css">
    </head>

    <body>
        <form name="Keisanki">
            <div>
                <input type="text" id="kakubasyo" disabled></input>
            </div>
            <div>
                <input type="button" class="suuzi" value="1" onclick=enzan(1)>
                <input type="button" class="suuzi" value="2" onclick=enzan(2)>
                <input type="button" class="suuzi" value="3" onclick=enzan(3)>
                <input type="button" class="enzansi" value="+" onclick=enzan(10)>
            </div>
            <div>
                <input type="button" class="suuzi" value="4" onclick=enzan(4)>
                <input type="button" class="suuzi" value="5" onclick=enzan(5)>
                <input type="button" class="suuzi" value="6" onclick=enzan(6)>
                <input type="button" class="enzansi" value="-" onclick=enzan(11)>
            </div>
            <div>
                <input type="button" class="suuzi" value="7" onclick=enzan(7)>
                <input type="button" class="suuzi" value="8" onclick=enzan(8)>
                <input type="button" class="suuzi" value="9" onclick=enzan(9)>
                <input type="button" class="enzansi" value="×" onclick=enzan(12)>
            </div>
            <div>
                <input type="button" class="enzansi" value="C" onclick=enzan(15) id="reset">
                <input type="button" class="suuzi" value="0" onclick=enzan(0)>
                <input type="button" class="enzansi" value="=" onclick=enzan(14) id="equal">
                <input type="button" class="enzansi" value="÷" onclick=enzan(13)>
        
        </form>
    </body>
</html>
